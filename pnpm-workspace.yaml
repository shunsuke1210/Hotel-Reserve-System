packages:
  - apps/*
  - packages/*

# インストール時のスクリプトの実行を許可する依存関係
# （esbuild：vite・vitest・tsx が使う。@swc/core：API のビルドとテストで使う。
#   @prisma/engines：マイグレーションに使うスキーマエンジンを取得する。prisma：Node.js の版を確かめる。
#   argon2：パスワードのハッシュ化（Argon2id）のネイティブモジュールを用意する）
allowBuilds:
  esbuild: true
  '@swc/core': true
  '@prisma/engines': true
  prisma: true
  argon2: true

# 全パッケージで同じ版を使う依存関係（package.json では "catalog:" で参照する）
catalog:
  '@date-fns/tz': ^1.5.0
  '@nestjs/common': ^11.2.7
  '@nestjs/core': ^11.2.7
  '@nestjs/platform-express': ^11.2.7
  '@nestjs/testing': ^11.2.7
  '@prisma/adapter-pg': ^7.10.1
  '@prisma/client': ^7.10.1
  '@swc/core': ^1.16.18
  '@tanstack/react-query': ^5.104.5
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@types/express': ^5.0.6
  '@types/node': ^24.19.2
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/supertest': ^7.2.1
  '@vitejs/plugin-react': ^5.2.0
  argon2: ^0.45.1
  i18next: ^26.5.3
  # jsdom 30 は Node.js 24.15 以上が必要なため 29 を使う
  jsdom: ^29.1.1
  pg: ^8.23.1
  prettier: ^3.9.10
  prisma: ^7.10.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-i18next: ^17.1.0
  react-router: ^7.18.4
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  supertest: ^7.3.1
  tsx: ^4.23.15
  typescript: ~5.9.3
  unplugin-swc: ^2.0.0
  vite: ^7.3.7
  vitest: ^5.0.5
  zod: ^4.6.7
