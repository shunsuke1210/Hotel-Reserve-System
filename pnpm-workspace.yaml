packages:
  - apps/*
  - packages/*

# インストール時のスクリプトの実行を許可する依存関係
# （esbuild：vite・vitest が使う。@swc/core：API のビルドとテストで使う）
allowBuilds:
  esbuild: true
  '@swc/core': true

# 全パッケージで同じ版を使う依存関係（package.json では "catalog:" で参照する）
catalog:
  '@date-fns/tz': ^1.5.0
  '@nestjs/common': ^11.2.7
  '@nestjs/core': ^11.2.7
  '@nestjs/platform-express': ^11.2.7
  '@nestjs/testing': ^11.2.7
  '@swc/core': ^1.16.18
  '@types/express': ^5.0.6
  '@types/node': ^24.19.2
  '@types/supertest': ^7.2.1
  prettier: ^3.9.10
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  supertest: ^7.3.1
  typescript: ~5.9.3
  unplugin-swc: ^2.0.0
  vite: ^7.3.7
  vitest: ^5.0.5
  zod: ^4.6.7
